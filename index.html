<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Multimodal AI Chatbot
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <header>

        <h1>
            Multimodal AI Assistant
        </h1>

        <p>
            Chat, search, upload documents and
            get AI assistance.
        </p>

    </header>


    <main>

        <section
            id="chatBox"
            class="chat-box"
        >

            <div class="message assistant">

                Hello! How can I help you today?

            </div>

        </section>


        <section class="controls">

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.txt,.docx,.md,image/png,image/jpeg"
            >

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
            >

            <button
                onclick="sendMessage()"
            >
                Send
            </button>

        </section>


        <section class="document-section">

            <h2>
                Documents
            </h2>

            <button
                onclick="uploadDocument()"
            >
                Upload Document
            </button>

            <div id="documents"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
